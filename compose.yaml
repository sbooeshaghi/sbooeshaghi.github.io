services:
  website:
    build:
      context: .
    image: sina-bio:${SINA_BIO_TAG:-local}
    ports:
      - "127.0.0.1:${SINA_BIO_PORT:-8780}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
