    <meta charset="UTF-8" />

    />
    <link rel="stylesheet" href="styles.css" />
    <title>Works | Sina Booeshaghi</title>
    <script>
      function escapeHTML(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function slugify(value) {
        return String(value)
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/&/g, " and ")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      function formatPublication(publication) {
        const summary = publication.summary.trim();
        const pageHref = `works/${slugify(publication.title)}.html`;

        return `
          <li class="publication-item">
            <article class="publication-card">
              <h2 class="publication-title">
                <a class="publication-page-link" href="${escapeHTML(
                  pageHref
                )}">${escapeHTML(publication.title)}</a>
              </h2>
              <p class="publication-summary">
                ${escapeHTML(summary)}
              </p>
            </article>
          </li>
        `;
      }

      function formatPublications(publications) {
        return publications
          .map((publication) => formatPublication(publication))
          .join("");
      }

      document.addEventListener("DOMContentLoaded", () => {
        fetch("db/publications.json", { cache: "no-store" })
          .then((response) => response.json())
          .then((publications) => {
          document.getElementById("publicationList").innerHTML =
            formatPublications(publications);
        });
      });
    </script>
  </head>

    </nav>

    <ol reversed class="publication-list" id="publicationList"></ol>
  </body>
