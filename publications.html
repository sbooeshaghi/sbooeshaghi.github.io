    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Selected works by A. Sina Booeshaghi."
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Works | Sina Booeshaghi</title>
    <script>
      const dateFormatter = new Intl.DateTimeFormat("en", {
        month: "short",
        day: "numeric",
        year: "numeric",
      });
      const monthFormatter = new Intl.DateTimeFormat("en", {
        month: "short",
        year: "numeric",
      });

      function escapeHTML(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatDate(date) {
        const parts = date.split("-").map(Number);

        if (parts.length === 1) {
          return date;
        }

        if (parts.length === 2) {
          return monthFormatter.format(new Date(parts[0], parts[1] - 1, 1));
        }

        return dateFormatter.format(
          new Date(parts[0], parts[1] - 1, parts[2])
        );
      }

      function slugify(value) {
        return String(value)
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/&/g, " and ")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      function citationCountFor(publication, citedByData) {
        return (
          citedByData.works?.[slugify(publication.title)]?.cited_by?.length || 0
        );
      }

      function publicationVersions(publication) {
        return [...(publication.versions || publication.links || [])].sort(
          (a, b) => String(b.date).localeCompare(String(a.date))
        );
      }

      function versionHref(version) {
        return version.url || version.doi || "";
      }

      function formatPublication(publication, citedByData) {
        const summary = publication.summary.trim();
        const wordCount = summary.split(/\s+/).length;
        const pageHref = `works/${slugify(publication.title)}.html`;
        const citationCount = citationCountFor(publication, citedByData);
        const versions = publicationVersions(publication);

        return `
          <li class="publication-item">
            <article class="publication-card">
              <h2 class="publication-title">
                <a class="publication-page-link" href="${escapeHTML(
                  pageHref
                )}">${escapeHTML(publication.title)}</a>
              </h2>
              <div class="publication-versions" aria-label="Work versions">
                <span class="publication-versions-label">Versions</span>
                <div class="publication-version-cards">
                  ${versions
                    .map((version, versionIndex) => {
                      const detail = [
                        version.name,
                        version.date ? formatDate(version.date) : "",
                      ]
                        .filter(Boolean)
                        .join(" · ");
                      return `
                      <a
                        class="publication-version-link${
                          versionIndex === 0 ? " is-current" : ""
                        }"
                        href="${escapeHTML(versionHref(version))}"
                        target="_blank"
                        rel="noopener"
                      >
                        <span class="publication-version-title">${escapeHTML(
                          version.title || publication.title
                        )}</span>
                        ${
                          detail
                            ? `<span class="publication-version-detail">${escapeHTML(
                                detail
                              )}</span>`
                            : ""
                        }
                      </a>
                    `;
                    })
                    .join("")}
                </div>
              </div>
              <div class="publication-meta">
                <span class="publication-citation-count">Citations: ${citationCount}</span>
                <span class="publication-word-count">${wordCount} words</span>
              </div>
              <p class="publication-summary">
                ${escapeHTML(summary)}
              </p>
            </article>
          </li>
        `;
      }

      function formatPublications(publications, citedByData) {
        return publications
          .map((publication) => formatPublication(publication, citedByData))
          .join("");
      }

      document.addEventListener("DOMContentLoaded", () => {
        Promise.all([
          fetch("db/publications.json", { cache: "no-store" }).then(
            (response) => response.json()
          ),
          fetch("db/cited-by.json", { cache: "no-store" }).then((response) =>
            response.json()
          ),
        ]).then(([publications, citedByData]) => {
            document.getElementById("publicationList").innerHTML =
              formatPublications(publications, citedByData);
          });
      });
    </script>
  </head>
  <body>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span aria-hidden="true">/</span>
      <span class="breadcrumb-current">Works</span>
    </nav>
    <h1>Works</h1>
    <ol reversed class="publication-list" id="publicationList"></ol>
  </body>
</html>
