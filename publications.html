<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-6P1ZQ0CC8F"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-6P1ZQ0CC8F");
    </script>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Selected works by A. Sina Booeshaghi."
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Works | Sina Booeshaghi</title>
    <script>
      const SELF_ORCID = "0000-0002-6442-4502";
      const SELF_NAMES = new Set([
        "a sina booeshaghi",
        "ali s booeshaghi",
        "sina booeshaghi",
        "ali sina booeshaghi",
      ]);

      function escapeHTML(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function slugify(value) {
        return String(value)
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/&/g, " and ")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      function formatYear(value) {
        const match = String(value || "").match(/\d{4}/);
        return match ? match[0] : "n.d.";
      }

      function citationCountFor(publication, citedByData) {
        return (
          citedByData.works?.[slugify(publication.title)]?.cited_by?.length || 0
        );
      }

      function normalizeAuthorName(value) {
        return String(value || "")
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, " ")
          .trim();
      }

      function coauthorCountFor(publicationAuthors) {
        const coauthors = new Set();

        Object.values(publicationAuthors.works || {}).forEach((work) => {
          (work.versions || []).forEach((version) => {
            (version.authors || []).forEach((author) => {
              const orcid = String(author.orcid || "").match(
                /\d{4}-\d{4}-\d{4}-[\dX]{4}/i
              )?.[0];
              const name = normalizeAuthorName(author.name);
              if (orcid?.toUpperCase() === SELF_ORCID || SELF_NAMES.has(name)) {
                return;
              }
              const key = orcid ? `orcid:${orcid.toUpperCase()}` : `name:${name}`;
              if (name) coauthors.add(key);
            });
          });
        });

        return coauthors.size;
      }

      function hIndexFor(citationCounts) {
        return [...citationCounts]
          .sort((a, b) => b - a)
          .filter((count, index) => count >= index + 1).length;
      }

      function formatNumber(value) {
        return value.toLocaleString("en-US");
      }

      function formatWorksSummary(publications, citedByData, publicationAuthors) {
        const citationCounts = publications.map((publication) =>
          citationCountFor(publication, citedByData)
        );
        const metrics = [
          [publications.length, "works"],
          [coauthorCountFor(publicationAuthors), "coauthors"],
          [citationCounts.reduce((total, count) => total + count, 0), "citations"],
          [hIndexFor(citationCounts), "h-index"],
        ];

        return metrics
          .map(
            ([value, label]) => `
              <div class="works-summary-item">
                <span class="works-summary-number">${formatNumber(value)}</span>
                <span class="works-summary-label">${label}</span>
              </div>
            `
          )
          .join("");
      }

      function formatVersions(publication) {
        const versions = publication.versions?.length
          ? publication.versions
          : publication.links || [];

        if (!versions.length) return "";

        const items = versions.map((version) => {
          const label = `${version.name || "Version"} (${formatYear(
            version.date
          )})`;
          const href = version.url || version.doi || "";
          return href
            ? `<a class="publication-card-version-link" href="${escapeHTML(
                href
              )}">${escapeHTML(label)}</a>`
            : escapeHTML(label);
        });

        return `
          <div class="publication-card-versions">
            <span class="publication-card-versions-label">Versions:</span>
            ${items.join(", ")}
          </div>
        `;
      }

      function formatPublication(publication, citedByData) {
        const summary = publication.summary.trim();
        const pageHref = `/object.html?id=${encodeURIComponent(`work:${slugify(publication.title)}`)}`;
        const citationCount = citationCountFor(publication, citedByData);

        return `
          <li class="publication-item">
            <article class="publication-card">
              <h2 class="publication-title">
                <a class="publication-page-link" href="${escapeHTML(
                  pageHref
                )}">${escapeHTML(publication.title)}</a>
              </h2>
              <div
                class="publication-citation-metric"
                aria-label="${citationCount} citations"
              >
                <span class="publication-citation-number">${formatNumber(
                  citationCount
                )}</span>
                <span class="publication-citation-label">citations</span>
              </div>
              <p class="publication-summary">
                ${escapeHTML(summary)}
              </p>
              ${formatVersions(publication)}
            </article>
          </li>
        `;
      }

      function formatPublications(publications, citedByData) {
        return publications
          .map((publication) => formatPublication(publication, citedByData))
          .join("");
      }

      document.addEventListener("DOMContentLoaded", () => {
        Promise.all([
          fetch("db/publications.json", { cache: "no-store" }).then(
            (response) => response.json()
          ),
          fetch("db/cited-by.json", { cache: "no-store" }).then((response) =>
            response.json()
          ),
          fetch("db/publication-authors.json", { cache: "no-store" }).then(
            (response) => response.json()
          ),
        ]).then(([publications, citedByData, publicationAuthors]) => {
          document.getElementById("worksSummary").innerHTML =
            formatWorksSummary(publications, citedByData, publicationAuthors);
          document.getElementById("publicationList").innerHTML =
            formatPublications(publications, citedByData);
        });
      });
    </script>
  </head>
  <body>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span aria-hidden="true">/</span>
      <span class="breadcrumb-current">Works</span>
    </nav>
    <h1>Works</h1>
    <section
      class="works-summary"
      id="worksSummary"
      aria-label="Works summary"
    ></section>
    <ul class="publication-list" id="publicationList"></ul>
  </body>
</html>
