[package]
name = "sciindex"
version = "0.1.0"
edition = "2021"
description = "Small Rust library and CLI for querying a grounded resource index."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "sciindex"
path = "src/lib.rs"

[[bin]]
name = "sciindex"
path = "src/main.rs"
